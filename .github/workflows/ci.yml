name: ci

on:
  push:
    branches:
      - main
    # Run CI only when code, deps, or workflow change.
    paths:
      - ".github/workflows/ci.yml"
      - "reachml/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    # Run CI only when code, deps, or workflow change.
    paths:
      - ".github/workflows/ci.yml"
      - "reachml/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Ruff lint
        run: uvx ruff check reachml tests
      - name: Ruff format check
        run: uvx ruff format --check reachml tests

  tests:
    name: tests (python 3.12)
    runs-on: ubuntu-latest
    # PRs run only 3.12; main/dispatch run full matrix.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync project environment
        run: uv sync --frozen --group dev --extra cplex
      - name: Run tests
        run: uv run pytest

  tests_full:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Full matrix on non-PR events.
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync project environment
        run: uv sync --frozen --group dev --extra cplex
      - name: Run tests
        run: uv run pytest

  build:
    name: build (sdist/wheel)
    runs-on: ubuntu-latest
    # Build only on non-PR events.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build package
        run: uv build
      - name: Check package metadata
        run: uvx twine check dist/*
